<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Drive Text Reader</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Hofshi:wght@400;700&display=swap">
    <link rel="stylesheet" href="styles.css">
    <style>
        body { font-family: sans-serif; padding: 10px; margin: 0; background-color: #f9f9f9; }
        #auth-container { text-align: center; margin-top: 50px; }
        .btn { background: #1a73e8; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; }
        #html-output { display: none; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <!-- Sign-in Prompt for Mobile -->
    <div id="auth-container">
        <h2>Google Drive Text Reader</h2>
        <p>Sign in with your Google account to read your Drive texts.</p>
        <button class="btn" id="authorize_button" onclick="handleAuthClick()">Sign In & Load Texts</button>
    </div>

    <!-- Reader Output Container -->
    <div id="html-output"></div>

    <!-- Include your custom rendering logic -->
    <script src="app-new-logic.js"></script>

    <!-- Google Identity Services Script -->
    <script async defer src="https://accounts.google.com/gsi/client"></script>
    <script src="https://apis.google.com/js/api.js"></script>

    <script>
        const CLIENT_ID = 'justintholath.apps.googleusercontent.com'; // Replace with your Google Cloud Client ID
        const SCOPES = 'https://www.googleapis.com/auth/drive.readonly';
        
        let tokenClient;
        let gapiInited = false;
        let gisInited = false;

        function gapiLoaded() {
            gapi.load('client', initializeGapiClient);
        }

        async function initializeGapiClient() {
            await gapi.client.init({
                discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'],
            });
            gapiInited = true;
        }

        function gisLoaded() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: '', // defined later
            });
            gisInited = true;
        }

        function handleAuthClick() {
            tokenClient.callback = async (resp) => {
                if (resp.error !== undefined) {
                    throw (resp);
                }
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('html-output').style.display = 'block';
                await loadTextsFromDrive();
            };

            if (gapi.client.getToken() === null) {
                tokenClient.requestAccessToken({ prompt: 'consent' });
            } else {
                tokenClient.requestAccessToken({ prompt: '' });
            }
        }

        // Search Google Drive for a folder named "texts" and read its files
        async function loadTextsFromDrive() {
            try {
                // 1. Find the folder named "texts"
                const folderResponse = await gapi.client.drive.files.list({
                    q: "name = 'texts' and mimeType = 'application/vnd.google-apps.folder' and trashed = false",
                    fields: 'files(id, name)',
                });

                const folders = folderResponse.result.files;
                if (folders.length === 0) {
                    alert('Could not find a folder named "texts" in your Google Drive.');
                    return;
                }
                const folderId = folders[0].id;

                // 2. List all text/markdown files inside that folder
                const filesResponse = await gapi.client.drive.files.list({
                    q: `'${folderId}' in parents and trashed = false`,
                    fields: 'files(id, name, mimeType)',
                    orderBy: 'name',
                });

                const files = filesResponse.files;
                let displayText = "";

                // 3. Fetch content of each file sequentially
                for (const file of files) {
                    const fileContentResponse = await gapi.client.drive.files.get({
                        fileId: file.id,
                        alt: 'media',
                    });
                    
                    if (displayText) {
                        displayText += `\npb:\n`;
                    }
                    displayText += `\n${fileContentResponse.body}\n`;
                }

                // 4. Send combined text straight to your existing parser!
                convertMarkdown(displayText);

            } catch (err) {
                console.error("Error reading from Google Drive:", err);
                alert("Error loading texts: " + err.message);
            }
        }
    </script>
    <!-- Load GAPI client -->
    <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
    <script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
</body>
</html>
