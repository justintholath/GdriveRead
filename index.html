<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holy Sophia Text Reader</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Hofshi:wght@400;700&display=swap">
    <link rel="stylesheet" href="styles.css">
    <style>
        body { font-family: sans-serif; padding: 20px; margin: 0; background-color: #f9f9f9; }
        #auth-container { text-align: center; margin-top: 50px; }
        .btn { background: #1a73e8; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; }
        #selector-container { display: none; text-align: center; margin-top: 30px; }
        select { padding: 10px; font-size: 16px; border-radius: 4px; margin-right: 10px; }
        #html-output { display: none; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-top: 20px; }
    </style>
</head>
<body>

    <!-- Sign-in Prompt -->
    <div id="auth-container">
        <h2>Holy Sophia Text Reader</h2>
        <p>Sign in with your Google account to load your study folders.</p>
        <button class="btn" id="authorize_button" onclick="handleAuthClick()">Sign In with Google</button>
    </div>

    <!-- Folder Selection Dropdown (Hidden until signed in) -->
    <div id="selector-container">
        <h2>Select a Course Subject</h2>
        <select id="folder-select">
            <option value="">-- Choose a Subject Folder --</option>
        </select>
        <button class="btn" onclick="loadTextsFromSelectedFolder()">Read Texts</button>
    </div>

    <!-- Reader Output Container -->
    <div id="html-output"></div>

    <!-- Include your custom rendering logic -->
    <script src="app-new-logic.js"></script>

    <!-- Google Identity Services Script -->
    <script async defer src="https://accounts.google.com/gsi/client"></script>
    <script src="https://apis.google.com/js/api.js"></script>

    <script>
        const CLIENT_ID = '701771928636-md3bcgm9kkdp0lj09uhqupg01jvcr2ls.apps.googleusercontent.com'; // Your Client ID
        const SCOPES = 'https://www.googleapis.com/auth/drive.readonly';
        
        let tokenClient;
        let gapiInited = false;
        let gisInited = false;

        function gapiLoaded() {
            gapi.load('client', initializeGapiClient);
        }

        async function initializeGapiClient() {
            await gapi.client.init({
                discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'],
            });
            gapiInited = true;
        }

        function gisLoaded() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: '', 
            });
            gisInited = true;
        }

        function handleAuthClick() {
            tokenClient.callback = async (resp) => {
                if (resp.error !== undefined) {
                    throw (resp);
                }
                document.getElementById('auth-container').style.display = 'none';
                await findHolySophiaSubfolders();
            };

            if (gapi.client.getToken() === null) {
                tokenClient.requestAccessToken({ prompt: 'consent' });
            } else {
                tokenClient.requestAccessToken({ prompt: '' });
            }
        }

        // 1. Find "Holy_Sophia" folder first, then list its subfolders (01_Dogma, 02_Patristic_Exegesis)
        async function findHolySophiaSubfolders() {
            try {
                // Find parent folder "Holy_Sophia"
                const parentResponse = await gapi.client.drive.files.list({
                    q: "name = 'Holy_Sophia' and mimeType = 'application/vnd.google-apps.folder' and trashed = false",
                    fields: 'files(id, name)',
                });

                const parents = parentResponse.result.files;
                if (!parents || parents.length === 0) {
                    alert('Could not find a folder named "Holy_Sophia" in your Google Drive.');
                    return;
                }
                const parentId = parents[0].id;

                // Find subfolders inside "Holy_Sophia"
                const subResponse = await gapi.client.drive.files.list({
                    q: `'${parentId}' in parents and mimeType = 'application/vnd.google-apps.folder' and trashed = false`,
                    fields: 'files(id, name)',
                    orderBy: 'name',
                });

                const subfolders = subResponse.result.files;
                const selectElement = document.getElementById('folder-select');
                selectElement.innerHTML = '<option value="">-- Choose a Subject Folder --</option>';

                if (subfolders && subfolders.length > 0) {
                    subfolders.forEach(folder => {
                        const option = document.createElement('option');
                        option.value = folder.id;
                        option.textContent = folder.name;
                        selectElement.appendChild(option);
                    });
                }

                // Show the dropdown selector interface
                document.getElementById('selector-container').style.display = 'block';

            } catch (err) {
                console.error("Error finding subfolders:", err);
                alert("Error loading folders: " + err.message);
            }
        }

        // 2. Load text files from the chosen subfolder
        async function loadTextsFromSelectedFolder() {
            const selectElement = document.getElementById('folder-select');
            const folderId = selectElement.value;

            if (!folderId) {
                alert('Please select a folder first.');
                return;
            }

            try {
                const filesResponse = await gapi.client.drive.files.list({
                    q: `'${folderId}' in parents and trashed = false`,
                    fields: 'files(id, name, mimeType)',
                    orderBy: 'name',
                });

                const files = filesResponse.result.files;
                if (!files || files.length === 0) {
                    alert('Selected folder is empty.');
                    return;
                }

                let displayText = "";

                for (const file of files) {
                    const fileContentResponse = await gapi.client.drive.files.get({
                        fileId: file.id,
                        alt: 'media',
                    });
                    
                    if (displayText) {
                        displayText += `\npb:\n`;
                    }
                    displayText += `\n${fileContentResponse.body}\n`;
                }

                // Hide dropdown and display reader view
                document.getElementById('selector-container').style.display = 'none';
                document.getElementById('html-output').style.display = 'block';
                convertMarkdown(displayText);

            } catch (err) {
                console.error("Error reading folder contents:", err);
                alert("Error loading texts: " + err.message);
            }
        }
    </script>
    <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
    <script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
</body>
</html>
